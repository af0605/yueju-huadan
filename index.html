<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#fdf4f1" />
<meta name="format-detection" content="telephone=no" />
<title>粤剧花旦 · 扫码见</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f6b8c4'/%3E%3Ccircle cx='16' cy='13' r='4.2' fill='%23c51a2b'/%3E%3Cpath d='M8 24c2.4-3.4 5-5 8-5s5.6 1.6 8 5' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="clouds" aria-hidden="true"></div>

<div id="stage-wrap">
  <div class="halo" aria-hidden="true"></div>
  <div class="hero-wrap" id="heroWrap">
    <canvas class="hero" id="hero" role="img" aria-label="粤剧花旦 阿冠"></canvas>
  </div>
  <div class="stage-tip" id="stageTip">点我一下</div>
</div>

<header class="bar">
  <div class="bar-l">
    <h1 id="ipName">花旦</h1>
    <p id="ipSub">粤剧 · 花旦</p>
  </div>
  <button class="bar-btn" id="turn" title="转个身" aria-label="转个身">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 12a8 8 0 1 1-2.6-5.9" /><path d="M20 4.5V10h-5.5" />
    </svg>
  </button>
</header>

<main class="sheet" id="sheet">
  <div class="grab" aria-hidden="true"></div>
  <div class="log" id="log" role="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form class="ask" id="askForm" autocomplete="off">
    <input id="askInput" type="text" placeholder="问她点什么…" enterkeyhint="send" maxlength="80" />
    <button id="askBtn" type="submit" aria-label="发送">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.4 2L3.4 14z"/></svg>
    </button>
  </form>
</main>

<div class="boot" id="boot">
  <div class="boot-inner">
    <div class="ring"></div>
    <p id="bootText">正在上妆…</p>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
